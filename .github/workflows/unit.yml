name: Unit

# Gates a PR on the pytest unit suite (tests/) — fast, pure-logic coverage, alongside (not
# instead of) e2e.yml's Playwright suite. No server, secrets, or browser install needed.

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt

      - name: Run unit test suite
        run: pytest -v
