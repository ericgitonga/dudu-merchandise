<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{% block title %}Dudu Merchandise{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" sizes="any" />
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" type="image/png" sizes="32x32" />
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,500;0,600;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="breadcrumb-bar">
      <a href="https://ericgitonga.com">← ERIC GITONGA</a>
      <span class="crumb-sep" aria-hidden="true">/</span>
      <a href="https://dudus.ericgitonga.com">DUDUS</a>
      <span class="crumb-sep" aria-hidden="true">/</span>
      <span aria-current="page">SHOP</span>
    </div>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">Dudu Merchandise</a>
      <nav>
        <a href="{{ url_for('prints') }}">Prints</a>
        <!-- Apparel route stays wired up (issue #18); not linked from the nav yet. -->
        <!-- Coasters route stays wired up (issue #14); not linked from the nav yet. -->
        <a class="cart-link" href="{{ url_for('cart_page') }}">
          Cart <span class="cart-badge" id="cart-badge">{{ cart_count }}</span>
        </a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Photography &amp; merchandise by Eric Gitonga Mbaya — Dudus of Kenya.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/cart-common.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </body>
</html>
